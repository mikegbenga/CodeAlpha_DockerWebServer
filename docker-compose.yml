# CodeAlpha DevOps Task 4 — Web server stack
#   docker compose up -d                          # web server only
#   docker compose --profile monitoring up -d     # + nginx exporter + Prometheus
name: codealpha-webserver

services:
  web:
    build:
      context: .
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VCS_REF: ${VCS_REF:-unknown}
    image: codealpha/webserver:${TAG:-latest}
    container_name: codealpha-web
    ports:
      - "${HOST_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    # --- hardening ---
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # --- resource limits ---
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 32M
    # --- log rotation ---
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [frontend]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: codealpha-nginx-exporter
    profiles: [monitoring]
    command: ["--nginx.scrape-uri=http://web:8080/nginx_status"]
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "9113:9113"
    restart: unless-stopped
    networks: [frontend]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: codealpha-prometheus
    profiles: [monitoring]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks: [frontend]

networks:
  frontend:
    driver: bridge

volumes:
  prometheus-data:
