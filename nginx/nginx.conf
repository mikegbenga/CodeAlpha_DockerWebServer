# Main NGINX config — runs unprivileged (non-root) inside the container
worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable temp paths for read-only root filesystems
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Structured JSON access logs -> stdout -> `docker logs`
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';

    # Don't spam logs with health probes
    map $request_uri $loggable {
        ~^/healthz  0;
        default     1;
    }
    access_log /dev/stdout json if=$loggable;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 1m;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_vary         on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Basic abuse protection
    limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;

    include /etc/nginx/conf.d/*.conf;
}
