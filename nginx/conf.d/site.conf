server {
    listen      8080 default_server;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    limit_req zone=perip burst=40 nodelay;

    # Security headers
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" always;
    add_header X-Request-ID            $request_id always;

    # Liveness/readiness probe used by Docker HEALTHCHECK and compose
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","server":"nginx"}';
    }

    # Metrics for nginx-prometheus-exporter (private networks only)
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    # Long-lived caching for static assets
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-Frame-Options         "DENY" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" always;
    }

    # Block hidden files (.git, .env, ...)
    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html { internal; }
    location = /50x.html { internal; }
}
